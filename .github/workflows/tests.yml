name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test coding
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/frontend.test.cjs tests/navigation.test.cjs tests/file_tools.test.cjs
