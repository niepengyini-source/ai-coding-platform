{% if stage_bar %}<nav class="project-stage-bar" aria-label="项目阶段导航">
  {% for step in stage_bar.steps %}{% if step.url %}<a class="stage-bar-item{% if step.done %} is-done{% endif %}{% if step.recommended %} is-recommended{% endif %}" href="{{ step.url }}"{% if step.current %} aria-current="location"{% endif %}><span class="stage-bar-num" aria-hidden="true">{% if step.done and not step.current %}✓{% else %}{{ step.number }}{% endif %}</span><span class="stage-bar-label">{{ step.number }}. {{ step.label }}</span></a>{% else %}<span class="stage-bar-item is-disabled" aria-disabled="true" title="{{ step.disabled_hint }}"><span class="stage-bar-num" aria-hidden="true">{{ step.number }}</span><span class="stage-bar-label">{{ step.number }}. {{ step.label }}</span></span>{% endif %}{% endfor %}
</nav>{% endif %}
