<ol class="setup-steps" aria-label="编码准备步骤">
  {% for step in workflow.preparation.steps %}<li class="{% if step.complete %}is-complete{% endif %}"{% if step.current %} aria-current="step"{% endif %} aria-label="{{ step.label }}：{% if step.current %}当前步骤{% elif step.complete %}已完成{% else %}待完成{% endif %}"><span class="setup-step-number" aria-hidden="true">{% if step.complete and not step.current %}✓{% else %}{{ step.number }}{% endif %}</span><span>{{ step.label }}</span></li>{% endfor %}
</ol>
