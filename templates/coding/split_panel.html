{% if can_split or can_suggest_split %}<section class="split-panel" data-split-panel data-mode="{% if can_split %}personal{% else %}suggestion{% endif %}" data-endpoint="{% if can_split %}{% url 'assignment_split' assignment.id %}{% else %}{% url 'split_suggestion' assignment.id %}{% endif %}">
<div class="section-heading"><button class="button secondary" type="button" data-split-preview>拆分单元</button></div>
<div class="split-controls" data-split-controls hidden><span class="muted small">选文字{% if can_split %}（可连续选择）{% endif %} → 看预览 → 确认</span><div class="button-row"><button class="button secondary" type="button" data-split-undo disabled>撤销上次</button><button class="button secondary" type="button" data-split-cancel>取消</button></div></div>
<div data-split-parts hidden><div class="split-piece-list" data-split-list></div>{% if can_suggest_split %}<label for="split-reason">拆分理由</label><textarea id="split-reason" name="split_reason" rows="2" maxlength="2000"></textarea>{% endif %}<button class="button" type="button" data-split-confirm disabled>{% if can_split %}确认拆分并编码{% else %}发送建议{% endif %}</button></div>
<p class="hint" data-split-status role="status" aria-live="polite"></p></section>{% endif %}
