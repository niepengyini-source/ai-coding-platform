{% extends 'base.html' %}{% block title %}注册 · AI辅助编码平台{% endblock %}{% block content %}
<section class="card workspace-auth"><nav class="workspace-auth-tabs" aria-label="账号操作"><a href="{% url 'login' %}">登录</a><span aria-current="page">注册</span></nav><h1>注册账号</h1>
{% if registration_open %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="button full" type="submit">注册并进入平台</button></form>{% else %}<div class="notice">此后台暂不允许自行注册，请联系项目负责人添加账号。</div>{% endif %}
<div class="auth-switch">已经有账号？<a href="{% url 'login' %}">返回登录</a></div></section>
{% endblock %}
